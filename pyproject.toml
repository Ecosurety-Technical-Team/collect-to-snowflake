[project]
name = "collect-to-snowflake"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "David Torralba Goitia", email = "dgoitia@ecosurety.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.5",
    "pandas>=3.0.5",
    "pyodbc>=5.3.0",
    "snowflake-connector-python>=4.7.2",
]

[project.scripts]
collect-to-snowflake = "src:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
]
